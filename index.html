 if(id==="ANKH")return wrap(`<circle cx="50" cy="27" r="15" fill="none" stroke="${gold}" stroke-width="8"/><path d="M50 42V85 M25 57H75" stroke="${gold}" stroke-width="8"/>`);
 if(id==="SNAKE")return wrap(`<path d="M30 80 Q70 65 35 50 Q5 38 35 20 Q55 8 70 23" fill="none" stroke="#b88b32" stroke-width="13"/><circle cx="72" cy="22" r="10" fill="#e5bd53"/><circle cx="75" cy="19" r="2" fill="#111"/>`);
 if(id==="SUN")return wrap(`<circle cx="50" cy="50" r="25" fill="#f6ca45" stroke="#fff0a0" stroke-width="4"/><g stroke="#e6b33a" stroke-width="7">${Array.from({length:8},(_,i)=>{let a=i*Math.PI/4,x1=50+31*Math.cos(a),y1=50+31*Math.sin(a),x2=50+43*Math.cos(a),y2=50+43*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}).join("")}</g>`);
 if(id==="WILD")return circle("WILD","#f3c84b");
 const fruit={CHERRY:["●","●","#d83d45"],LEMON:["◆","","#f3cf43"],ORANGE:["●","","#ef8c28"],GRAPE:["●","●","#7140a8"],MELON:["◉","","#41a96b"],STAR:["★","","#f1c642"],DIAMOND:["◆","","#4bb5e8"],SEVEN:["7","","#d64545"],BELL:["♟","","#d7aa42"],BAR:["BAR","","#e8e8e8"],CLOVER:["♣","","#38a66a"],BLUE:["◆","","#4f8fe8"],PURPLE:["◆","","#8b59c7"],GREEN:["◆","","#39aa70"],RED:["◆","","#df5151"],YELLOW:["◆","","#e3c544"],CROWN:["♛","","#e5bd53"]};
 const f=fruit[id]; if(f)return wrap(`<circle cx="50" cy="50" r="39" fill="#101a15" stroke="#dcb64e" stroke-width="3"/><text x="50" y="61" text-anchor="middle" font-size="${id==="BAR"?22:39}" font-weight="900" fill="${f[2]}" font-family="Arial">${f[0]}</text>`);

function weightedIndex(){
 const data=games[current], total=data.weights.reduce((a,b)=>a+b,0);
 let n=Math.random()*total;
 for(let i=0;i<data.weights.length;i++){n-=data.weights[i];if(n<0)return i}
 return data.weights.length-1;
}
function symIndex(){return weightedIndex()}

 const data=games[current], bonusId=data.symbols.indexOf(data.bonus);
 let count=0;g.flat().forEach(x=>{if(x===bonusId)count++});return count;
}
function evaluate(g){
 const data=games[current];let total=0,wins=[];
 lines.forEach((line,li)=>{
  let first=g[line[0]][0],count=1;
  for(let c=1;c<5;c++){
   let id=g[line[c]][c];
   if(id===first || first===data.symbols.length-1 || id===data.symbols.length-1)count++;
   else break;
  }
  if(count>=3){
   let id=first===data.symbols.length-1?g[1][0]:first;
   let m=data.multipliers[id]||1;
   let win=bet*(count===3?m:count===4?m*3:m*8);
   total+=win;wins.push({li,win,line});
  }
 });
 return{total,wins};
}

async function spin(){
 if(busy||!current)return;
 const paidSpin=freeSpins<=0;
 let cost=paidSpin?bet*5:0;
 if(paidSpin&&balance<cost){$("message").textContent="Nicht genug Spielmünzen.";return}
 busy=true;
 if(paidSpin) balance-=cost; else freeSpins--;
 spins++;renderBalance();save();
 ["spin","max","minus","plus"].forEach(id=>$(id).disabled=true);
 $("message").textContent="Die Walzen drehen…";
 const reels=[...document.querySelectorAll(".reel")];

 const fast=turbo;

 await new Promise(r=>setTimeout(r,spinTime));
 clearInterval(interval);

 // Final result is chosen before the staggered stop, so the animation always
 // lands exactly on the evaluated result.
 const g=gridRandom();
 const stopStep=fast?55:115;

 // Stop column by column, like a real 5-reel machine.
 for(let col=0;col<5;col++){
   const columnReels=reels.slice(col*3,col*3+3);
   columnReels.forEach((x,row)=>{
     x.innerHTML=symbolHtml(g[row][col]);
     x.classList.add("stopanim","stopped");
     x.classList.remove("spinanim");
   });
   if(col<4) await new Promise(r=>setTimeout(r,stopStep));
 }

 await new Promise(r=>setTimeout(r,fast?80:180));
 setGrid(g);
 reels.forEach(x=>x.classList.remove("spinanim","stopanim","stopped"));

 let res=evaluate(g);
 const bonusCount=countBonus(g), data=games[current];
 if(bonusCount>=data.freeTrigger){
   const awarded=data.freeSpins;
   freeSpins+=awarded;bonusPending=true;
   $("message").textContent=`🎁 ${bonusCount} ${data.bonus}-Symbole – ${awarded} Freispiele!`;
   log(`🎁 Bonus: +${awarded} Freispiele`);
 } else if(res.total){
   balance+=res.total;renderBalance();
   $("message").textContent=`🎉 Gewinn: ${fmt(res.total)} Spielmünzen`;
   log(`+${fmt(res.total)} Münzen`);
   res.wins.forEach(w=>w.line.forEach((row,c)=>$(`cell-${row}-${c}`).classList.add("win")));
   setTimeout(()=>document.querySelectorAll(".win").forEach(x=>x.classList.remove("win")),1500)
 } else {
   $("message").textContent=freeSpins>0?`Freispiele übrig: ${freeSpins}`:"Kein Gewinn – nächste Runde!";
   log(freeSpins>0?`Freispiel – noch ${freeSpins}`:"Kein Gewinn")
 }
 renderBalance();save();busy=false;["spin","max","minus","plus"].forEach(id=>$(id).disabled=false);
 if(auto&&((freeSpins>0)||(balance>=bet*5)))timer=setTimeout(spin,turbo?180:600);else if(auto){auto=false;$("auto").textContent="▶ Autoplay"}
}>
